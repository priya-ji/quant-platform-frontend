<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quant Terminal — Research, Backtest, Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0e14; --panel:#12161f; --panel-2:#171c28; --line:#232a38;
    --ink:#e6eaf2; --ink-dim:#96a0b5; --ink-faint:#5c6679;
    --accent:#4cc9c0;        /* teal — interactive / active */
    --accent-deep:#1f7a73;
    --pos:#3fb950; --neg:#f85149; --warn:#e3b341; --cond:#d29922;
    --kill:#ff3b3b;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:'Inter',system-ui,sans-serif;
    --disp:'Space Grotesk',var(--sans);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  button{font-family:var(--sans);cursor:pointer}
  input,textarea{font-family:var(--sans)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .dim{color:var(--ink-dim)} .faint{color:var(--ink-faint)}
  .pos{color:var(--pos)} .neg{color:var(--neg)}

  /* ---- shell ---- */
  #app{display:flex;flex-direction:column;height:100vh}
  .topbar{display:flex;align-items:center;gap:20px;padding:0 18px;height:52px;
    background:linear-gradient(180deg,#12161f,#0e121a);border-bottom:1px solid var(--line);flex:none}
  .brand{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
  .brand .dot{width:9px;height:9px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  .status-strip{display:flex;gap:18px;align-items:center;margin-left:8px}
  .stat{display:flex;flex-direction:column;line-height:1.15}
  .stat .k{font-size:9.5px;letter-spacing:.6px;color:var(--ink-faint);text-transform:uppercase}
  .stat .v{font-family:var(--mono);font-size:12.5px;font-weight:500}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;
    font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--panel-2)}
  .led{width:7px;height:7px;border-radius:50%}
  .led.on{background:var(--pos);box-shadow:0 0 8px var(--pos)}
  .led.off{background:var(--ink-faint)}
  .led.live{background:var(--neg);box-shadow:0 0 8px var(--neg)}
  .kill{background:transparent;border:1.5px solid var(--kill);color:var(--kill);
    font-family:var(--disp);font-weight:600;letter-spacing:.5px;padding:8px 14px;border-radius:6px;
    text-transform:uppercase;font-size:11.5px;transition:.12s}
  .kill:hover{background:var(--kill);color:#0b0e14;box-shadow:0 0 18px rgba(255,59,59,.5)}

  .body{display:flex;flex:1;min-height:0}
  .rail{width:340px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}

  /* ---- chat rail ---- */
  .rail-head{padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--disp);font-weight:600}
  .rail-head small{display:block;font-family:var(--sans);font-weight:400;color:var(--ink-dim);font-size:11px;margin-top:2px}
  .chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:100%;padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.5}
  .msg.user{background:var(--accent-deep);color:#eafffb;align-self:flex-end;border-bottom-right-radius:2px}
  .msg.bot{background:var(--panel-2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:2px}
  .msg .assum{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
  .msg .assum div{color:var(--ink-dim);font-size:11px}
  .chip{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;
    background:#0e1620;border:1px solid var(--line);color:var(--accent);margin-top:6px}
  .composer{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
  .composer textarea{width:100%;resize:none;background:var(--panel-2);border:1px solid var(--line);
    color:var(--ink);border-radius:7px;padding:9px;font-size:12.5px;min-height:56px;outline:none}
  .composer textarea:focus{border-color:var(--accent)}
  .composer .row{display:flex;gap:8px}
  .btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:8px 12px;
    border-radius:7px;font-size:12px;font-weight:500;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#062b28;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{filter:brightness(1.08);color:#062b28}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:5px 9px;font-size:11px}
  .prompts{display:flex;flex-wrap:wrap;gap:6px}
  .prompts button{font-size:10.5px;padding:4px 8px;background:#0e1620;border:1px solid var(--line);
    color:var(--ink-dim);border-radius:5px}
  .prompts button:hover{color:var(--accent);border-color:var(--accent)}

  /* ---- tabs + panels ---- */
  .tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  .tab{padding:12px 14px;font-size:12px;color:var(--ink-dim);border-bottom:2px solid transparent;font-weight:500}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .content{flex:1;overflow-y:auto;padding:18px}
  .grid{display:grid;gap:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .panel h3{margin:0 0 10px;font-family:var(--disp);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
  .panel h3 .mut{color:var(--ink-faint);font-weight:400;font-size:11px;font-family:var(--sans)}

  .metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .metric{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px}
  .metric .k{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint)}
  .metric .v{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:3px}
  .metric .v.sm{font-size:14px}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:right;font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint);
     font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:6px 8px;border-bottom:1px solid #1a2030;font-family:var(--mono);font-variant-numeric:tabular-nums}
  tr:hover td{background:#0e1420}

  .check{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #1a2030;align-items:flex-start}
  .badge{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:4px;flex:none;letter-spacing:.3px}
  .badge.PASS{background:rgba(63,185,80,.12);color:var(--pos);border:1px solid rgba(63,185,80,.3)}
  .badge.CONDITIONAL_PASS{background:rgba(210,153,34,.12);color:var(--cond);border:1px solid rgba(210,153,34,.3)}
  .badge.FAIL{background:rgba(248,81,73,.12);color:var(--neg);border:1px solid rgba(248,81,73,.3)}
  .check .cn{font-family:var(--mono);font-size:11.5px;color:var(--ink);min-width:150px}
  .check .cd{color:var(--ink-dim);font-size:11.5px;line-height:1.45}

  .verdict{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:8px;font-family:var(--disp);
    font-weight:600;font-size:14px}
  .verdict.PASS{background:rgba(63,185,80,.1);color:var(--pos);border:1px solid rgba(63,185,80,.35)}
  .verdict.CONDITIONAL_PASS{background:rgba(210,153,34,.1);color:var(--cond);border:1px solid rgba(210,153,34,.35)}
  .verdict.FAIL{background:rgba(248,81,73,.1);color:var(--neg);border:1px solid rgba(248,81,73,.35)}

  .alert{display:flex;gap:9px;padding:9px 11px;border-radius:7px;margin-bottom:8px;font-size:12px;line-height:1.4;align-items:flex-start}
  .alert.high{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.28)}
  .alert.medium{background:rgba(227,179,65,.07);border:1px solid rgba(227,179,65,.25)}
  .alert .sev{font-family:var(--mono);font-size:9px;text-transform:uppercase;padding:2px 6px;border-radius:4px;flex:none}
  .alert.high .sev{background:var(--neg);color:#160607}
  .alert.medium .sev{background:var(--warn);color:#191203}

  .proc{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:8px;margin-bottom:8px}
  .proc .hb{width:8px;height:8px;border-radius:50%;flex:none}
  .proc .hb.ok{background:var(--pos);animation:pulse 1.6s infinite}
  .proc .hb.bad{background:var(--neg)}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(63,185,80,.5)}50%{opacity:.6;box-shadow:0 0 0 5px rgba(63,185,80,0)}}

  .empty{color:var(--ink-faint);font-size:12.5px;padding:24px;text-align:center;line-height:1.6}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel-2);
    border:1px solid var(--accent);color:var(--ink);padding:10px 16px;border-radius:8px;font-size:12.5px;
    z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .toast.err{border-color:var(--neg)}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--ink-dim);margin-top:6px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .swatch{width:12px;height:2.5px;border-radius:2px;display:inline-block}
  .cfg{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;font-size:12px}
  .cfg input{width:120px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:6px 8px;font-family:var(--mono);text-align:right}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#222a39;border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  /* Responsive research workspace */
  :root{--ink-faint:#8692a8;--panel:#111824;--panel-2:#172131;--line:#273348}
  #app{height:100dvh} .topbar{height:auto;min-height:72px;flex-wrap:wrap;gap:14px;padding:16px 24px}
  .brand{font-size:16px;white-space:nowrap}.status-strip{gap:24px}.stat{gap:5px}.stat .v{font-size:13px}
  .body{min-height:0}.rail{width:330px;overflow-y:auto}.rail-head{padding:20px;position:sticky;top:0;background:var(--panel);z-index:2;font-size:16px}
  .rail-head small{line-height:1.6;margin-top:4px}.chat{flex:1 0 180px;min-height:180px;padding:16px;max-height:40vh}
  .composer{padding:16px;gap:14px;flex:none}.composer textarea{min-height:94px;line-height:1.6;padding:12px}
  .composer small{font-size:11px;line-height:1.6;color:var(--ink-dim)}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-grid label{display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--ink-dim)}
  .field-grid label:first-child{grid-column:1/-1}
  select,input[type=date],input[type=text]{color-scheme:dark;background:#0d1420;border:1px solid var(--line);border-radius:8px;color:var(--ink);font:12px var(--sans);padding:10px;width:100%;min-width:0}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}.toggle{display:flex;gap:9px;align-items:center;font-size:12px}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .prompts{gap:8px}.prompts button{padding:8px 10px;text-align:left;line-height:1.4;flex:1 1 130px}
  .tabs{overflow-x:auto;gap:8px;padding:0 20px}.tab{white-space:nowrap;cursor:pointer;background:none;border:0;border-bottom:2px solid transparent;padding:17px 10px}.tabs .spacer{display:none}
  .strategy-label{max-width:190px;overflow:hidden;text-overflow:ellipsis;margin-left:auto}
  .content{padding:28px;max-width:1600px;width:100%;margin:auto}.panel{padding:22px;border-radius:14px}.panel h3{font-size:15px;flex-wrap:wrap}
  .workspace-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.workspace-head h1{font:600 29px var(--disp);letter-spacing:-.7px;margin:6px 0 10px}.workspace-head p{color:var(--ink-dim);line-height:1.7;margin:0;max-width:620px}
  .eyebrow{font:10px var(--mono);letter-spacing:1.6px;color:var(--accent);text-transform:uppercase}
  .feed-status{border:1px solid var(--line);padding:10px 14px;border-radius:9px;white-space:nowrap;color:var(--ink-dim);font-size:11px}
  .quote-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}.quote-card{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:left;color:var(--ink)}
  .quote-card.active{border-color:var(--accent);background:#12272d}.quote-card strong{font:500 12px var(--mono)}.quote-price{font:500 24px var(--mono);margin:14px 0 8px}.quote-card small{color:var(--ink-dim);font-size:10px}
  .overview-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr);gap:18px}.chart-empty{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px dashed var(--line);border-radius:10px;padding:24px;background:linear-gradient(180deg,#111f2b,#111824)}
  .chart-empty strong{font:500 18px var(--disp);margin-bottom:10px}.chart-empty p{max-width:380px;color:var(--ink-dim);line-height:1.7;margin:0}
  .setup-step{display:flex;gap:12px;margin:20px 0}.step-number{width:26px;height:26px;flex:none;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--accent);font:12px var(--mono)}.setup-step strong{font-size:12px}.setup-step p{font-size:11px;line-height:1.7;color:var(--ink-dim);margin:5px 0 0;overflow-wrap:anywhere}
  .context-note{padding:12px 16px;margin-bottom:20px;border:1px solid #314558;border-radius:9px;background:#14202d;color:var(--ink-dim);font-size:12px;line-height:1.7}
  .watchlist-form{display:flex;gap:8px;align-items:center;margin-bottom:18px}.watchlist-form input{max-width:330px}.muted{color:var(--ink-dim);font-size:11px;line-height:1.7}.legend{flex-wrap:wrap}.empty{padding:48px 24px;color:var(--ink-dim)}.kill{margin-left:auto;padding:8px 10px;font-size:10px}.panel{overflow:auto}
  @media(max-width:1200px){.status-strip{order:3;width:100%;margin:0;justify-content:space-between}.overview-grid{grid-template-columns:1fr}.topbar>.pill{display:none}.rail{width:300px}.content{padding:20px}.workspace-head h1{font-size:25px}}
  @media(max-width:760px){body{overflow:auto}#app{height:auto;min-height:100dvh}.body{flex-direction:column}.main{order:0}.rail{order:1;width:100%;border-right:0;border-top:1px solid var(--line)}.chat{max-height:240px}.content{overflow:visible;padding:16px}.topbar{padding:15px;gap:10px}.status-strip{gap:12px;flex-wrap:wrap}.stat .k{font-size:9px}.stat .v{font-size:11px}.tabs{padding:0 8px}.workspace-head{flex-direction:column;gap:12px}.quote-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quote-price{font-size:21px}.panel{padding:16px}.strategy-label{display:none}.rail-head{position:static}}

</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;
// On Vercel, use the API deployed on the same origin.  When the dashboard is
// opened directly from disk, fall back to the local FastAPI development server.
// A browser-local override is still available through localStorage.api_base.
const API = localStorage.getItem('api_base') ||
  (window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '');
const TOKEN = localStorage.getItem('api_token') || 'demo-token';
const H = {'Content-Type':'application/json','Authorization':'Bearer '+TOKEN};

async function api(path, opts={}){
  const r = await fetch(API+path, {headers:H, ...opts});
  if(!r.ok){ let d; try{d=await r.json()}catch{d={detail:r.statusText}} throw new Error(Array.isArray(d.detail)?d.detail.map(x=>x.msg).join('; '):(d.detail||('HTTP '+r.status))); }
  return r.json();
}
const fmt = (n,d=2)=> (n==null||isNaN(n))?'—':Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (n,d=1)=> (n==null||isNaN(n))?'—':(n*100).toFixed(d)+'%';
const signClass = n => n>0?'pos':n<0?'neg':'';

/* ---------- tiny SVG line chart (equity + benchmark) ---------- */
function EquityChart({equity, bench, label="Strategy equity"}){
  if(!equity) return null;
  const dates = Object.keys(equity); const e = dates.map(d=>equity[d]);
  const b = bench ? dates.map(d=>bench[d]) : null;
  const all = b ? e.concat(b) : e;
  const min = Math.min(...all), max = Math.max(...all);
  const W=760, Hh=240, pad=6;
  const x = i => pad + i*(W-2*pad)/(dates.length-1);
  const y = v => Hh-pad - (v-min)/(max-min||1)*(Hh-2*pad);
  const path = arr => arr.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area = e.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')
    +` L ${x(e.length-1)} ${Hh-pad} L ${x(0)} ${Hh-pad} Z`;
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${Hh}`} style={{width:'100%',height:240}}>
        <defs><linearGradient id="eg" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor="#4cc9c0" stopOpacity="0.22"/>
          <stop offset="1" stopColor="#4cc9c0" stopOpacity="0"/></linearGradient></defs>
        <path d={area} fill="url(#eg)"/>
        {b && <path d={path(b)} fill="none" stroke="#5c6679" strokeWidth="1.4" strokeDasharray="4 3"/>}
        <path d={path(e)} fill="none" stroke="#4cc9c0" strokeWidth="1.8"/>
      </svg>
      <div className="legend">
        <span><i className="swatch" style={{background:'#4cc9c0'}}></i>{label}</span>
        {b && <span><i className="swatch" style={{background:'#5c6679'}}></i>Benchmark (buy &amp; hold)</span>}
        <span className="faint mono">{dates[0]} → {dates[dates.length-1]}</span>
      </div>
    </div>
  );
}
function Drawdown({equity}){
  if(!equity) return null;
  const dates=Object.keys(equity); const e=dates.map(d=>equity[d]);
  let peak=-Infinity; const dd=e.map(v=>{peak=Math.max(peak,v);return v/peak-1;});
  const W=760,Hh=90,pad=4; const min=Math.min(...dd);
  const x=i=>pad+i*(W-2*pad)/(dates.length-1);
  const y=v=>pad + (v/ (min||-1))*(Hh-2*pad);
  const area=dd.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ')
    +` L ${x(dd.length-1)} ${pad} L ${x(0)} ${pad} Z`;
  return <svg viewBox={`0 0 ${W} ${Hh}`} style={{width:'100%',height:90}}>
    <path d={area} fill="rgba(248,81,73,.18)" stroke="#f85149" strokeWidth="1.2"/></svg>;
}

/* ---------- metric block ---------- */
function Metrics({m}){
  const items=[['CAGR',pct(m.cagr)],['Sharpe',fmt(m.sharpe)],['Sortino',fmt(m.sortino)],
   ['Max DD',pct(m.max_drawdown)],['Calmar',fmt(m.calmar)],['Vol',pct(m.volatility)],
   ['Alpha',pct(m.alpha)],['Beta',fmt(m.beta)],['Win rate',pct(m.win_rate,0)],
   ['Profit factor',fmt(m.profit_factor)],['Trades',m.trade_count],['Turnover',fmt(m.turnover,1)+'x'],
   ['Total return',pct(m.total_return)],['Avg hold',fmt(m.avg_holding_days,0)+'d'],
   ['Gross exp',pct(m.avg_gross_exposure,0)],['Costs',fmt(m.total_costs,0)]];
  return <div className="metrics">{items.map(([k,v],i)=>
    <div className="metric" key={i}><div className="k">{k}</div><div className="v sm">{v}</div></div>)}</div>;
}

/* ======================================================================= */
function App(){
  const [useLLM,setUseLLM]=useState(false);
  const [dataSource,setDataSource]=useState('alpaca');
  const recentEnd=()=>{const d=new Date();d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10);};
  const recentStart=()=>{const d=new Date();d.setUTCFullYear(d.getUTCFullYear()-2);return d.toISOString().slice(0,10);};
  const [start,setStart]=useState(recentStart);
  const [end,setEnd]=useState(recentEnd);
  const [market,setMarket]=useState(null);
  const [marketError,setMarketError]=useState('');
  const [symbols,setSymbols]=useState('AAPL,MSFT,SPY');
  const [refreshKey,setRefreshKey]=useState(0);
  const [health,setHealth]=useState(null);
  const [mon,setMon]=useState(null);
  const [pred,setPred]=useState(null);
  const [messages,setMessages]=useState([
    {role:'bot',content:"Describe a strategy in plain English and I'll turn it into a versioned, testable spec — never executable code. Then backtest, validate, and promote it to paper."}
  ]);
  const [input,setInput]=useState('');
  const [busy,setBusy]=useState(false);
  const [strategy,setStrategy]=useState(null);   // {strategy_id, version, conversation_id, spec, ...}
  const [strategies,setStrategies]=useState([]);
  const [backtest,setBacktest]=useState(null);
  const [validation,setValidation]=useState(null);
  const [tab,setTab]=useState('market');
  const [toast,setToast]=useState(null);
  const chatRef=useRef();

  const notify=(msg,err)=>{setToast({msg,err});setTimeout(()=>setToast(null),3200);};

  // Finish each request before scheduling another; never show demo holdings in live mode.
  useEffect(()=>{
    let alive=true,timer;
    setMon(null);setPred(null);setMarket(null);setMarketError('');
    async function tick(){
      try{
        if(dataSource==='sample'){
          const [h,mo,pr]=await Promise.all([api('/api/health'),api('/api/monitoring'),api('/api/predictive')]);
          if(alive){setHealth(h);setMon(mo);setPred(pr);}
        }else{
          const [h,quotes]=await Promise.all([api('/api/health'),api('/api/market/latest?symbols='+encodeURIComponent(symbols))]);
          if(alive){setHealth(h);setMarket(quotes);setMarketError('');}
          if(quotes.status==='not_configured')return;
        }
      }catch(e){if(alive){setMarketError(e.message);setHealth({status:'down'});}}
      if(alive)timer=setTimeout(tick,dataSource==='sample'?10000:15000);
    }
    tick();return ()=>{alive=false;clearTimeout(timer);};
  },[dataSource,symbols,refreshKey]);
  useEffect(()=>{ if(chatRef.current) chatRef.current.scrollTop=chatRef.current.scrollHeight; },[messages]);
  const refreshList=useCallback(()=>api('/api/strategies').then(d=>setStrategies(d.strategies)).catch(()=>{}),[]);
  useEffect(()=>{refreshList();},[refreshList]);

  async function send(text){
    const msg=(text??input).trim(); if(!msg||busy) return;
    setMessages(m=>[...m,{role:'user',content:msg}]); setInput(''); setBusy(true);
    try{
      const body={message:msg, conversation_id:strategy?.conversation_id, strategy_id:strategy?.strategy_id,use_llm:useLLM};
      const r=await api('/api/chat',{method:'POST',body:JSON.stringify(body)});
      setStrategy(r);
      setMessages(m=>[...m,{role:'bot',content:r.explanation,assumptions:r.assumptions,
        chip:`${r.spec.name} · v${r.version} · ${r.content_hash} · ${r.backend}`}]);
      setBacktest(null); setValidation(null); refreshList();
    }catch(e){ setMessages(m=>[...m,{role:'bot',content:'Error: '+e.message}]); }
    setBusy(false);
  }

  async function runBacktest(){
    if(!strategy) return; setBusy(true);
    try{ const r=await api('/api/backtests',{method:'POST',
      body:JSON.stringify({strategy_id:strategy.strategy_id,version:strategy.version,spec:strategy.spec,start,end,data_source:dataSource})});
      setBacktest(r); setTab('backtest'); notify('Backtest complete — '+r.backtest_id);
    }catch(e){notify(e.message,true);} setBusy(false);
  }
  async function runValidation(){
    if(!strategy) return; setBusy(true); notify('Running validation battery…');
    try{ const r=await api('/api/validation',{method:'POST',
      body:JSON.stringify({strategy_id:strategy.strategy_id,version:strategy.version,spec:strategy.spec,start,end,data_source:dataSource})});
      setValidation(r); setTab('validation'); notify('Validation: '+r.verdict);
    }catch(e){notify(e.message,true);} setBusy(false);
  }
  async function promotePaper(){
    if(!strategy) return; setBusy(true);
    try{ await api('/api/paper/enable',{method:'POST',
      body:JSON.stringify({strategy_id:strategy.strategy_id,version:strategy.version,environment:'paper'})});
      notify('Promoted to paper — process started'); setTab('monitor');
    }catch(e){notify(e.message,true);} setBusy(false);
  }
  async function kill(){
    if(!confirm('KILL ALL LIVE TRADING?\nThis disables new live orders and stops live processes. Positions are preserved.')) return;
    try{ const r=await api('/api/kill-switch',{method:'POST'}); notify(r.message); }catch(e){notify(e.message,true);}
  }

  const p=mon?.portfolio; const hbProc=mon?.processes?.[0];
  const latestTrade=market?.quotes?.map(q=>q.timestamp).sort().at(-1);
  const isDemo=dataSource==='sample';
  const researchUnavailable=!isDemo&&market?.status==='not_configured';
  return (
  <div id="app">
    <div className="topbar">
      <div className="brand"><span className="dot"></span>QUANT&nbsp;TERMINAL</div>
      <div className="status-strip">
        <div className="stat"><span className="k">{isDemo?'Demo data as of':'Latest trade'}</span><span className="v">{isDemo?(mon?.as_of||'—'):(latestTrade?new Date(latestTrade).toLocaleTimeString():'Not connected')}</span></div>
        <div className="stat"><span className="k">{isDemo?'Demo equity':'Account equity'}</span><span className="v">{p?fmt(p.equity,0):'—'}</span></div>
        <div className="stat"><span className="k">Total P&L</span><span className={'v '+signClass(p?.total_pnl)}>{p?fmt(p.total_pnl,0):'—'}</span></div>
        <div className="stat"><span className="k">Realized P&L</span><span className={'v '+signClass(p?.realized_pnl)}>{p?fmt(p.realized_pnl,0):'—'}</span></div>
        <div className="stat"><span className="k">Positions</span><span className="v">{p?p.n_positions:'—'}</span></div>
      </div>
      <div className="spacer"></div>
      <span className="pill"><span className={'led '+(mon?.broker_connected?'on':'off')}></span>{isDemo?'Demo broker':'Account not connected'}</span>
      <span className="pill"><span className={'led '+(hbProc?.healthy?'on':'off')}></span>heartbeat {hbProc?hbProc.heartbeat_age_s+'s':'—'}</span>
      <span className="pill"><span className={'led '+(mon?.live_enabled?'live':'off')}></span>live {mon?.live_enabled?'ARMED':'off'}</span>
      <button className="kill" onClick={kill}>■ Kill all live</button>
    </div>

    <div className="body">
      {/* research rail */}
      <div className="rail">
        <div className="rail-head">Research<small>Natural-language → versioned strategy spec</small></div>
        <div className="chat" ref={chatRef}>
          {messages.map((m,i)=>(
            <div key={i} className={'msg '+(m.role==='user'?'user':'bot')}>
              <div>{m.content}</div>
              {m.chip && <div className="chip">{m.chip}</div>}
              {m.assumptions && m.assumptions.length>0 &&
                <div className="assum">{m.assumptions.map((a,j)=><div key={j}>• {a}</div>)}</div>}
            </div>
          ))}
          {busy && <div className="msg bot dim">working…</div>}
        </div>
        <div className="composer">
          <label className="toggle"><input type="checkbox" checked={useLLM} onChange={e=>setUseLLM(e.target.checked)}/> Use Claude to interpret strategy</label>
          <div className="field-grid">
            <label>Data <select value={dataSource} disabled={busy} onChange={e=>{setDataSource(e.target.value);setStart(e.target.value==='sample'?'2020-06-01':recentStart());setEnd(e.target.value==='sample'?'2024-12-31':recentEnd());setBacktest(null);setValidation(null);}}>
              <option value="sample">Synthetic sample</option><option value="alpaca">Alpaca US historical</option></select></label>
            <label>Start <input type="date" value={start} disabled={busy} onChange={e=>{setStart(e.target.value);setBacktest(null);setValidation(null);}}/></label>
            <label>End <input type="date" value={end} disabled={busy} onChange={e=>{setEnd(e.target.value);setBacktest(null);setValidation(null);}}/></label>
          </div>
          <small>{isDemo?'Offline demo · synthetic prices and virtual funds.':'US stocks · Alpaca prices. Add provider credentials to enable market data and research.'}</small>
          {!strategy && <div className="prompts">
            {(isDemo?['Six-month momentum on US large caps, top 5, monthly, vs SPY','Companies gaining market share faster than sector, improving margins, reasonable valuation, quarterly, vs SPY, top 8','Momentum on Indian large caps, top 6, vs NIFTYBEES']:['Six-month momentum on US large caps, top 5, monthly, vs SPY']).map((q,i)=>
              <button key={i} onClick={()=>send(q)}>{q.slice(0,42)}…</button>)}
          </div>}
          {strategy && <div className="prompts">
            {(isDemo?['add sector growth','remove momentum','use quarterly rebalance','compare against QQQ','top 10']:['use quarterly rebalance','compare against QQQ','top 10']).map((q,i)=>
              <button key={i} onClick={()=>send(q)}>{q}</button>)}
          </div>}
          <textarea value={input} placeholder={strategy?'Modify the strategy conversationally…':'Describe a strategy…'}
            onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}/>
          <div className="row">
            <button className="btn primary" style={{flex:1}} disabled={busy} onClick={()=>send()}>Send</button>
            <button className="btn" disabled={!strategy||busy||researchUnavailable} onClick={runBacktest}>Backtest</button>
            <button className="btn" disabled={!strategy||busy||researchUnavailable} onClick={runValidation}>Validate</button>
          </div>
        </div>
      </div>

      {/* main */}
      <div className="main">
        <div className="tabs">
          {[['market','Overview'],['backtest','Backtest'],['validation','Validation'],['monitor','Portfolio'],
            ['predict','Risk forecast'],['risk','Risk & Audit']].map(([k,l])=>
            <button key={k} className={'tab'+(tab===k?' active':'')} aria-current={tab===k?'page':undefined} onClick={()=>setTab(k)}>{l}</button>)}
          <div className="spacer"></div>
          <div className="tab strategy-label" style={{color:'var(--ink-faint)'}}>
            {strategy?`${strategy.spec.name} · v${strategy.version}`:'no strategy selected'}</div>
        </div>
        <div className="content">
          {tab==='backtest' && <BacktestView bt={backtest} strategy={strategy} onRun={runBacktest} onPromote={promotePaper} busy={busy||researchUnavailable}/>}
          {tab==='validation' && <ValidationView v={validation} onRun={runValidation} busy={busy||!strategy||researchUnavailable}/>}
          {tab==='market' && <MarketView snapshot={market} error={marketError} symbols={symbols} onSymbols={setSymbols} onRetry={()=>setRefreshKey(n=>n+1)} isDemo={isDemo} onResearch={()=>setTab('backtest')}/>}
          {tab==='monitor' && (isDemo?<MonitorView mon={mon}/>:<AccountSetup/>)}
          {tab==='predict' && (isDemo?<PredictView pred={pred}/>:<AccountSetup forecast/>)}
          {tab==='risk' && <><div className="context-note">Risk limits below are configured policy values. Reconciliation refers to the local demo portfolio.</div><RiskView/></>}
        </div>
      </div>
    </div>
    {toast && <div className={'toast'+(toast.err?' err':'')}>{toast.msg}</div>}
  </div>);
}

function AccountSetup({forecast=false}){
  return <div className="panel"><span className="eyebrow">{forecast?'Portfolio risk':'Portfolio connection'}</span><h2>Connect a portfolio to see {forecast?'risk estimates':'account values'}</h2><p className="muted">Market prices alone do not provide your cash, holdings or P&amp;L. Choose a broker paper account or a simulated portfolio funded with virtual cash. No account is connected yet.</p><p className="context-note">Demo portfolio values are available only when you explicitly select Synthetic sample in the research panel.</p></div>;
}
function MarketView({snapshot,error,symbols,onSymbols,onRetry,isDemo,onResearch}){
  const [draft,setDraft]=useState(symbols);
  const [selected,setSelected]=useState(symbols.split(',')[0]);
  const [history,setHistory]=useState({});
  const [inputError,setInputError]=useState('');
  useEffect(()=>{setHistory({});setSelected(symbols.split(',')[0]);},[symbols,isDemo]);
  useEffect(()=>{
    if(!snapshot?.quotes)return;
    setHistory(previous=>{
      const next={...previous};
      snapshot.quotes.forEach(q=>{const points={...(next[q.symbol]||{}),[q.timestamp]:q.price};next[q.symbol]=Object.fromEntries(Object.entries(points).sort(([a],[b])=>a.localeCompare(b)).slice(-120));});
      return next;
    });
  },[snapshot]);
  function applySymbols(e){
    e.preventDefault();const list=[...new Set(draft.toUpperCase().split(',').map(s=>s.trim()).filter(Boolean))];
    if(!list.length||list.length>6||list.some(s=>! /^[A-Z][A-Z0-9.\-]{0,14}$/.test(s))){setInputError('Enter 1–6 US stock symbols, separated by commas.');return;}
    setInputError('');onSymbols(list.join(','));
  }
  const ready=snapshot?.quotes?.length>0;
  const unconfigured=snapshot?.status==='not_configured';
  const points=history[selected]||{};
  return <div>
    <div className="workspace-head"><div><span className="eyebrow">Market workspace</span><h1>Market overview</h1><p>Follow US stocks, turn an idea into a strategy, and test it against historical prices.</p></div><span className="feed-status">{isDemo?'Demo selected':error?'Feed unavailable':unconfigured?'Connection required':ready?'Alpaca · '+snapshot.feed:'Connecting…'}</span></div>
    {isDemo&&<div className="context-note">You selected synthetic demo data. Switch to Alpaca US historical to connect the market feed.</div>}
    {error&&<div role="alert" className="context-note">{error} {ready?'Displayed values may be outdated.':''}</div>}
    <form className="watchlist-form" onSubmit={applySymbols}><input type="text" aria-label="Watchlist symbols" value={draft} onChange={e=>setDraft(e.target.value)} placeholder="AAPL, MSFT, SPY"/><button className="btn" type="submit">Update watchlist</button></form>
    {inputError&&<p role="alert" className="neg">{inputError}</p>}
    <div className="quote-grid">{symbols.split(',').map(symbol=>{const q=snapshot?.quotes?.find(q=>q.symbol===symbol);return <button className={'quote-card'+(selected===symbol?' active':'')} key={symbol} onClick={()=>setSelected(symbol)}><strong>{symbol} <span className="faint">/ USD</span></strong><div className="quote-price">{q?fmt(q.price):'—'}</div><small>{q?(q.stale?'Stale trade · ':'Trade · ')+new Date(q.timestamp).toLocaleTimeString():unconfigured?'Connect market data':ready?'No trade available':'Awaiting provider data'}</small></button>;})}</div>
    <div className="overview-grid"><div className="panel"><h3>{selected} <span className="mut">Latest trade price</span></h3>
      {Object.keys(points).length>1?<EquityChart equity={points} label={selected+' · USD'}/>:<div className="chart-empty"><strong>{unconfigured?'Connect your market feed':ready?'Waiting for the next trade':'Price history appears here'}</strong><p>{unconfigured?'Prices and charts will populate from Alpaca once your server credentials are configured.':ready?'The chart builds from actual trade updates while this page is open.':'Choose a symbol above. No generated prices or demo charts are shown in this workspace.'}</p></div>}
      <p className="muted">{snapshot?.fetched_at?'Last fetched '+new Date(snapshot.fetched_at).toLocaleString()+' · ':''}Updates every 15 seconds when connected. IEX covers one exchange; old trades are marked stale.</p>
    </div><div className="panel"><span className="eyebrow">Get started</span><h3 style={{marginTop:10}}>Your research workflow</h3>
      <div className="setup-step"><span className="step-number">01</span><div><strong>Connect market data</strong><p>{ready?'Feed connected. Select a stock to inspect its price.':'Add ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY in Render Environment. Keep keys on the server.'}</p></div></div>
      <div className="setup-step"><span className="step-number">02</span><div><strong>Describe your strategy</strong><p>Use the research panel to define a US price-based strategy. Claude is optional and needs its own API key.</p></div></div>
      <div className="setup-step"><span className="step-number">03</span><div><strong>Backtest and validate</strong><p>Choose dates, run the engine, and inspect performance and risk checks on the selected data.</p></div></div>
      <button className="btn primary" onClick={unconfigured?onRetry:onResearch}>{unconfigured?'Check connection again':'Open research'}</button>
    </div></div>
  </div>;
}

function BacktestView({bt,strategy,onRun,onPromote,busy}){
  if(!strategy) return <div className="panel"><span className="eyebrow">Strategy research</span><h2>Test your next idea</h2><p className="muted">Describe a strategy in the research panel, choose a data source and date range, then run a backtest. Returns, drawdowns and benchmark comparisons will appear here.</p><div className="chart-empty"><strong>No backtest yet</strong><p>Try: Six-month momentum on US large caps, top 5, monthly, vs SPY.</p></div></div>;
  if(!bt) return <div className="empty">Strategy <b className="mono">{strategy.spec.name}</b> ready.<br/><br/>
    <button className="btn primary" onClick={onRun} disabled={busy}>Run backtest</button></div>;
  return <div className="grid">
    <div className="panel">
      <p className="mut">Data: {bt.data?.source || 'sample'} {bt.data?.feed || '(synthetic)'} · {bt.start} → {bt.end}</p>
      <h3>Equity curve <span className="mono chip">{bt.backtest_id}</span>
        <span className="spacer" style={{flex:1}}></span>
        <button className="btn sm" onClick={onRun} disabled={busy}>Re-run</button>
        <button className="btn sm primary" style={{marginLeft:8}} onClick={onPromote} disabled={busy||bt.data?.source==='alpaca'}>Promote → paper</button></h3>
      <EquityChart equity={bt.equity_curve} bench={bt.benchmark_curve}/>
      <div style={{marginTop:10}}><span className="faint" style={{fontSize:11}}>Drawdown</span><Drawdown equity={bt.equity_curve}/></div>
    </div>
    <div className="panel"><h3>Performance <span className="mut">final equity {fmt(bt.final_equity,0)}</span></h3><Metrics m={bt.metrics}/></div>
    {bt.orders_sample?.length>0 && <div className="panel"><h3>Orders <span className="mut">first {bt.orders_sample.length}</span></h3>
      <table><thead><tr><th>Date</th><th>Sym</th><th>Side</th><th>Qty</th><th>Price</th><th>Notional</th><th>Fee</th></tr></thead>
      <tbody>{bt.orders_sample.map((o,i)=><tr key={i}><td>{String(o.date).slice(0,10)}</td><td>{o.symbol}</td>
        <td className={o.side==='buy'?'pos':'neg'}>{o.side}</td><td>{fmt(o.qty,1)}</td><td>{fmt(o.price)}</td>
        <td>{fmt(o.notional,0)}</td><td>{fmt(o.fee)}</td></tr>)}</tbody></table></div>}
  </div>;
}

function ValidationView({v,onRun,busy}){
  if(!v) return <div className="empty">Run validation to stress-test the strategy for overfitting,<br/>look-ahead, cost sensitivity and regime robustness.<br/><br/>
    <button className="btn primary" onClick={onRun} disabled={busy}>Run validation</button></div>;
  return <div className="grid">
    <div className="panel"><h3>Verdict<span className="spacer" style={{flex:1}}></span>
      <button className="btn sm" onClick={onRun} disabled={busy}>Re-run</button></h3>
      <p className="muted">Data source: {v.data?.source||'sample'} {v.data?.feed||'(synthetic)'}</p>
      <div className={'verdict '+v.verdict}>{v.verdict.replace('_',' ')}</div>
      <p className="dim" style={{marginTop:10,fontSize:12.5,lineHeight:1.5}}>{v.summary}</p></div>
    <div className="panel"><h3>Robustness checks</h3>
      {v.checks.map((c,i)=><div className="check" key={i}>
        <span className={'badge '+c.status}>{c.status.replace('_PASS','')}</span>
        <span className="cn">{c.name}</span><span className="cd">{c.detail}</span></div>)}</div>
    <div className="panel"><h3>Adversarial / skeptic <span className="mut">{v.adversarial.strength}</span></h3>
      <p className="dim" style={{fontSize:12.5}}>{v.adversarial.verdict_line}</p>
      {v.adversarial.findings.map((f,i)=><div key={i} className="alert medium">
        <span className="sev">bear</span><span>{f}</span></div>)}</div>
  </div>;
}

function MonitorView({mon}){
  if(!mon) return <div className="empty">Connecting to monitoring stream…</div>;
  const p=mon.portfolio;
  return <div className="grid">
    <div className="panel"><h3>Live processes <span className="mut">scheduler / workers</span></h3>
      {mon.processes.length===0 && <div className="empty" style={{padding:14}}>No running strategies. Promote one to paper from the Backtest tab.</div>}
      {mon.processes.map((pr,i)=><div className="proc" key={i}>
        <span className={'hb '+(pr.healthy?'ok':'bad')}></span>
        <span className="mono">{pr.strategy_id.slice(0,8)} · v{pr.version}</span>
        <span className="pill">{pr.environment}</span><span className="pill">{pr.state}</span>
        <span className="spacer" style={{flex:1}}></span>
        <span className="faint mono" style={{fontSize:11}}>hb {pr.heartbeat_age_s}s · signals {pr.processed_signal_count}</span></div>)}</div>
    <div className="panel"><h3>Portfolio <span className="mut">{p.environment}</span></h3>
      <div className="metrics">
        {[['Equity',fmt(p.equity,0)],['Cash',fmt(p.cash,0)],['Invested',fmt(p.invested,0)],
          ['Realized P&L',fmt(p.realized_pnl,0)],['Unrealized',fmt(p.unrealized_pnl,0)],['Total P&L',fmt(p.total_pnl,0)],
          ['Gross exp',fmt(p.gross_exposure,0)],['Net exp',fmt(p.net_exposure,0)]].map(([k,val],i)=>
          <div className="metric" key={i}><div className="k">{k}</div><div className="v sm">{val}</div></div>)}</div></div>
    <div className="panel"><h3>Positions</h3>
      {mon.positions.length===0? <div className="empty" style={{padding:14}}>Flat.</div>:
      <table><thead><tr><th>Symbol</th><th>Sector</th><th>Qty</th><th>Avg</th><th>Last</th><th>Mkt val</th><th>Unrl P&L</th></tr></thead>
      <tbody>{mon.positions.map((x,i)=><tr key={i}><td>{x.symbol}</td><td className="faint">{x.sector}</td>
        <td>{fmt(x.qty,1)}</td><td>{fmt(x.avg_price)}</td><td>{fmt(x.last_price)}</td><td>{fmt(x.market_value,0)}</td>
        <td className={signClass(x.unrealized_pnl)}>{fmt(x.unrealized_pnl,0)}</td></tr>)}</tbody></table>}
    </div>
    <div className="panel"><h3>Sector exposure</h3>
      <table><tbody>{Object.entries(mon.sector_exposure||{}).map(([s,val],i)=>
        <tr key={i}><td>{s}</td><td style={{textAlign:'right'}}>{fmt(val,0)}</td></tr>)}</tbody></table></div>
  </div>;
}

function PredictView({pred}){
  if(!pred) return <div className="empty">Loading predictive layer…</div>;
  if(!pred.scenarios||Object.keys(pred.scenarios).length===0)
    return <div className="empty">{pred.note||'No open positions to project.'}<br/>Promote a strategy to paper to see forward risk.</div>;
  const s=pred.scenarios;
  return <div className="grid">
    <div className="panel"><h3>Projected P&L <span className="mut">{pred.horizon_days}-day horizon · model estimates, not guarantees</span></h3>
      <div className="metrics">
        {[['Bull +1σ',s.bull_1sigma,'pos'],['Expected',s.expected,''],['Bear −1σ',s.bear_1sigma,'neg'],['Bear −2σ',s.bear_2sigma,'neg']].map(([k,val,cl],i)=>
          <div className="metric" key={i}><div className="k">{k}</div><div className={'v sm '+cl}>{fmt(val,0)}</div></div>)}</div>
      <div className="metrics" style={{marginTop:10}}>
        {[['Est. annual vol',pct(pred.estimated_annual_vol,0)],['Proj. drawdown',pct(pred.projected_drawdown_pct)],
          ['Max name',pct(pred.max_name_weight,0)],['Concentration HHI',fmt(pred.concentration_hhi)]].map(([k,val],i)=>
          <div className="metric" key={i}><div className="k">{k}</div><div className="v sm">{val}</div></div>)}</div></div>
    <div className="panel"><h3>What-if price shocks</h3>
      <div className="metrics">{Object.entries(pred.what_if||{}).map(([k,val],i)=>
        <div className="metric" key={i}><div className="k">{k.replace(/_/g,' ')}</div><div className={'v sm '+signClass(val)}>{fmt(val,0)}</div></div>)}</div></div>
    <div className="panel"><h3>Predictive alerts <span className="mut">advisory — never override hard risk controls</span></h3>
      {(!pred.alerts||pred.alerts.length===0)? <div className="empty" style={{padding:14}}>No elevated risk detected.</div>:
        pred.alerts.map((a,i)=><div className={'alert '+a.severity} key={i}>
          <span className="sev">{a.severity}</span><span>{a.message}</span></div>)}</div>
  </div>;
}

function RiskView(){
  const [risk,setRisk]=useState(null); const [audit,setAudit]=useState([]); const [recon,setRecon]=useState(null);
  const load=useCallback(()=>{ api('/api/risk').then(setRisk).catch(()=>{});
    api('/api/audit?n=40').then(d=>setAudit(d.events)).catch(()=>{});
    api('/api/reconciliation').then(setRecon).catch(()=>{}); },[]);
  useEffect(()=>{load(); const id=setInterval(load,4000); return ()=>clearInterval(id);},[load]);
  if(!risk) return <div className="empty">Loading risk policy…</div>;
  const a=risk.account, po=risk.position, pf=risk.portfolio, tr=risk.trading;
  return <div className="grid">
    <div className="panel"><h3>Risk policy <span className="mut">v{risk.policy_version} · global limits override strategy limits</span></h3>
      <div className="cfg">
        <span className="dim">Max capital</span><span className="mono">{fmt(a.max_capital,0)}</span>
        <span className="dim">Max daily loss</span><span className="mono">{fmt(a.max_daily_loss,0)}</span>
        <span className="dim">Max drawdown</span><span className="mono">{pct(a.max_drawdown_pct,0)}</span>
        <span className="dim">Max position %</span><span className="mono">{pct(po.max_position_pct,0)}</span>
        <span className="dim">Max sector %</span><span className="mono">{pct(pf.max_sector_pct,0)}</span>
        <span className="dim">Max order value</span><span className="mono">{fmt(tr.max_order_value,0)}</span>
        <span className="dim">Max participation</span><span className="mono">{pct(tr.max_participation_rate,0)}</span>
        <span className="dim">Live trading</span><span className="mono" style={{color:risk.live_trading_enabled?'var(--neg)':'var(--pos)'}}>{risk.live_trading_enabled?'ARMED':'disabled'}</span>
      </div></div>
    <div className="panel"><h3>Reconciliation <span className="mut">local vs broker</span></h3>
      {recon && <div>
        <span className={'verdict '+(recon.ok?'PASS':'FAIL')} style={{fontSize:12,padding:'6px 12px'}}>{recon.ok?'IN SYNC':'BREAK DETECTED'}</span>
        <p className="dim" style={{fontSize:12,marginTop:8}}>{recon.message}</p>
        {recon.position_breaks?.length>0 && <table><thead><tr><th>Sym</th><th>Local</th><th>Broker</th><th>Δ</th></tr></thead>
          <tbody>{recon.position_breaks.map((b,i)=><tr key={i}><td>{b.symbol}</td><td>{fmt(b.local_qty,1)}</td>
            <td>{fmt(b.broker_qty,1)}</td><td className="neg">{fmt(b.delta,1)}</td></tr>)}</tbody></table>}
      </div>}</div>
    <div className="panel"><h3>Audit trail <span className="mut">why every action happened</span></h3>
      <table><thead><tr><th>Seq</th><th>Time</th><th>Event</th><th>Actor</th></tr></thead>
      <tbody>{audit.slice().reverse().map((e,i)=><tr key={i}><td>{e.seq}</td>
        <td className="faint">{String(e.ts).slice(11,19)}</td><td style={{color:e.event_type==='KILL_SWITCH'?'var(--neg)':'var(--ink)'}}>{e.event_type}</td>
        <td className="faint">{e.actor}</td></tr>)}</tbody></table></div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
